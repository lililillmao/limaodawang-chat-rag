<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地模型聊天</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-light" disabled>
<style>
:root{--font-size:15px;--bg:#fff;--bg-side:#f7f7f8;--bg-input:#fff;--text:#1a1a1a;--text-dim:#777;--border:#e5e5e5;--accent:#4d6bfe;--accent-hover:#3b58ee;--code-bg:#f6f8fa;--think-bg:#f5f5f5;--hover:#ececec}
[data-theme="dark"]{--bg:#1a1a1a;--bg-side:#101010;--bg-input:#2a2a2a;--text:#e8e8e8;--text-dim:#999;--border:#2e2e2e;--accent:#6b8aff;--accent-hover:#85a0ff;--code-bg:#0d1117;--think-bg:#232323;--hover:#1f1f1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden;font-size:var(--font-size);line-height:1.65}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#8888;border-radius:4px}
#sidebar{width:260px;background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .2s;flex-shrink:0}
#sidebar.hide{margin-left:-260px}
.side-head{padding:14px}
.btn-new{width:100%;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:14px;cursor:pointer;font-weight:500}
.btn-new:hover{background:var(--accent-hover)}
.search-box{width:100%;margin-top:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text-dim)}
.star-filter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);padding:8px 4px 0;cursor:pointer;user-select:none}
.star-filter input{cursor:pointer}
.side-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.session-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.session-item:hover{background:var(--hover)}
.session-item.active{background:var(--hover);font-weight:500}
.session-title{overflow:hidden;text-overflow:ellipsis;flex:1}
.session-del{opacity:0;font-size:16px;color:var(--text-dim);padding:0 4px}
.session-item:hover .session-del{opacity:1}
.session-del:hover{color:#ff5555}
.session-pin{opacity:0;font-size:14px;color:var(--text-dim);padding:0 2px;cursor:pointer}
.session-item:hover .session-pin{opacity:1}
.session-pin.pinned{opacity:1;color:var(--accent)}
.session-rename-input{width:100%;padding:4px 8px;border-radius:6px;border:1px solid var(--accent);background:var(--bg-input);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.session-hit{font-size:11px;color:var(--accent);opacity:.85;margin-left:6px}
.session-star{color:#f5b301;font-size:12px;margin-left:6px}
.side-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.side-foot button{flex:1;min-width:calc(50% - 3px);padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px}
.side-foot button:hover{background:var(--hover)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:54px;padding:0 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:nowrap;overflow-x:auto}
.topbar select,.topbar button{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.icon-btn{width:36px;height:36px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
#modelSelect{max-width:180px}
#skillSelect{max-width:200px}
#modelSelect2{max-width:180px;display:none} /* 默认隐藏，由JS控制 */
#modelSelect2.show{display:inline-block}
.compare-toggle{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
.compare-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
#ctxInfo{font-size:11px;color:var(--text-dim);white-space:nowrap}
#messages{flex:1;overflow-y:auto;padding:24px 0 8px;position:relative}
.msg-wrap{max-width:900px;margin:0 auto 24px;padding:0 20px;position:relative}
.msg-wrap.wide{max-width:1300px}
.msg{display:flex;gap:12px}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600}
.avatar.user{background:#6b8aff}
.avatar.ai{background:#10a37f}
.msg-body{flex:1;min-width:0;overflow:hidden}
.msg-role{font-size:13px;color:var(--text-dim);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msg-tokens{font-size:11px;color:var(--text-dim);opacity:.7}
.msg-time{font-size:11px;color:var(--text-dim);opacity:.6;margin-left:auto}
.msg-content{word-wrap:break-word;overflow-wrap:anywhere;font-size:var(--font-size)}
.msg-content p{margin:0 0 10px}
.msg-content p:last-child{margin-bottom:0}
.msg-content ul,.msg-content ol{margin:8px 0 8px 22px}
.msg-content h1,.msg-content h2,.msg-content h3{margin:14px 0 8px}
.msg-content table{border-collapse:collapse;margin:10px 0}
.msg-content th,.msg-content td{border:1px solid var(--border);padding:6px 10px}
.msg-content blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--text-dim);margin:8px 0}
.msg-content a{color:var(--accent)}
.msg-content code:not(pre code){background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em;font-family:Consolas,monospace}
.code-block{margin:10px 0;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--code-bg);font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--border)}
.code-copy{cursor:pointer;padding:2px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12px}
.code-copy:hover{background:var(--hover);color:var(--text)}
.code-block pre{margin:0;padding:12px;overflow-x:auto;background:var(--code-bg)}
.code-block pre code{font-family:Consolas,monospace;font-size:13px}
.think-box{background:var(--think-bg);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;font-size:13px;color:var(--text-dim)}
.think-head{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;user-select:none;transition:background .15s}
.think-head:hover{background:var(--hover)}
.think-arrow{width:0;height:0;flex-shrink:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .18s ease}
.think-box.open .think-arrow{transform:rotate(90deg)}
.think-label{font-weight:500}
.think-meta{font-size:12px;opacity:.65;margin-left:auto}
.think-content{display:none;padding:10px 12px 12px;white-space:pre-wrap;line-height:1.7;max-height:420px;overflow-y:auto;border-top:1px solid var(--border)}
.think-box.open .think-content{display:block}
.cursor::after{content:"▊";animation:blink 1s infinite;color:var(--accent);margin-left:2px}
@keyframes blink{50%{opacity:0}}
.msg-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.msg-action{padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.msg-action:hover{background:var(--hover);color:var(--text);border-color:var(--accent)}
.msg-float{position:absolute;top:0;right:20px;display:flex;gap:4px;opacity:0;transition:opacity .15s;z-index:10}
.msg-wrap:hover .msg-float{opacity:1}
.msg-fbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg-side);color:var(--text-dim);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s}
.msg-fbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg-fbtn.ok{background:#10a37f;color:#fff;border-color:#10a37f}
.msg-fbtn.starred{color:#f5b301;border-color:#f5b301}
.msg-fbtn.speaking{background:#e34b4b;color:#fff;border-color:#e34b4b}
@media (hover: none){ .msg-float{opacity:1} }
.edit-area{width:100%;min-height:80px;padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--bg-input);color:var(--text);font-family:inherit;font-size:var(--font-size);line-height:1.6;resize:vertical;outline:none}
.edit-actions{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
.edit-actions button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-family:inherit}
.edit-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.msg-compare{grid-template-columns:1fr}}
.compare-col{border:1px solid var(--border);border-radius:10px;padding:12px;min-width:0;background:var(--bg-side)}
.compare-head{font-size:12px;color:var(--text-dim);margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:6px}
.compare-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.compare-col:nth-child(2) .compare-head .dot{background:#10a37f}
#jumpBtn{position:absolute;right:30px;bottom:120px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;font-size:18px;z-index:50}
#jumpBtn.show{display:flex}
#jumpBtn:hover{background:var(--accent-hover)}
.input-area{padding:10px 20px 20px;flex-shrink:0}
.input-inner{max-width:900px;margin:0 auto;border:1px solid var(--border);background:var(--bg-input);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.input-inner:focus-within{border-color:var(--accent)}
.quick-prompts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.quick-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.quick-btn:hover{background:var(--hover);color:var(--text);border-color:var(--accent)}
#input{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--text);font-family:inherit;font-size:var(--font-size);line-height:1.5;max-height:220px;min-height:24px}
.input-foot{display:flex;align-items:center;gap:8px}
.input-foot .hint{font-size:12px;color:var(--text-dim)}
.input-foot button{padding:6px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:14px;font-family:inherit}
.input-foot button.stop{background:#e34b4b}
#micBtn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:16px;font-family:inherit}
#micBtn:hover{background:var(--hover)}
#micBtn.recording{background:#e34b4b;color:#fff;border-color:#e34b4b;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{background:var(--bg);border-radius:14px;width:560px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:20px;border:1px solid var(--border)}
.modal h2{font-size:18px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:inherit;font-size:14px}
.field textarea{resize:vertical;min-height:90px}
.field input[type=range]{width:100%}
.row{display:flex;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-actions button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px;font-family:inherit}
.modal-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.preset-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.preset-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.preset-item button{font-size:12px;padding:3px 8px;margin-left:4px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:6px}
.status-dot.err{background:#e34b4b}
.msg-wrap.search-hit{animation:searchFlash 3s ease}
@keyframes searchFlash{0%,100%{background:transparent}15%,70%{background:rgba(255,220,0,.22);border-radius:12px}}
.version-nav{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:6px;background:var(--hover);font-size:11px}
.version-nav button{border:none;background:transparent;color:var(--text);cursor:pointer;padding:0 3px;font-size:11px;line-height:1;border-radius:4px}
.version-nav button:hover:not(:disabled){background:var(--accent);color:#fff}
.version-nav button:disabled{opacity:.3;cursor:default}
.quote-preview{display:none}
.quote-preview.show{display:block}
.quote-bar{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--hover);border-radius:6px;font-size:12px;margin-bottom:2px}
.quote-inner{flex:1;min-width:0}
.quote-head{color:var(--accent);font-size:11px;margin-bottom:2px;font-weight:500}
.quote-text{color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.quote-close{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
.quote-close:hover{color:#e34b4b}
.color-picker-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .15s}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.msg-wrap.summary .msg-body{background:var(--hover);border-radius:10px;padding:12px;border-left:3px solid var(--accent)}
.compress-info{font-size:11px;color:var(--text-dim);margin-left:auto;opacity:.85}
.tpl-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tpl-row{display:flex;gap:6px;align-items:center}
.tpl-input{flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.tpl-input:focus{border-color:var(--accent)}
.tpl-row button{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;font-family:inherit}
.tpl-row button:hover:not(:disabled){background:var(--hover)}
.tpl-row button:disabled{opacity:.3;cursor:not-allowed}
.emo-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;max-height:320px;overflow-y:auto;padding-right:4px}
.emo-row{display:flex;gap:6px;align-items:center}
.emo-row input{padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:inherit;font-size:13px;outline:none;min-width:0}
.emo-row input:focus{border-color:var(--accent)}
.emo-row input.emo-key{flex:0 0 96px;font-family:Consolas,monospace}
.emo-row input.emo-val{flex:1}
.emo-row button{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:inherit;flex-shrink:0}
.emo-row button:hover{background:var(--hover);color:var(--text)}
.emo-row button.del:hover{color:#e34b4b;border-color:#e34b4b}
#msgNav{position:absolute;right:4px;top:70px;bottom:110px;width:18px;display:none;flex-direction:column;gap:3px;overflow-y:auto;padding:4px 2px;z-index:40;scrollbar-width:none}
#msgNav::-webkit-scrollbar{display:none}
#msgNav.show{display:flex}
.nav-tick{width:100%;height:6px;border-radius:3px;background:var(--border);cursor:pointer;flex-shrink:0;transition:background .15s,transform .12s;opacity:.8}
.nav-tick:hover{background:var(--accent);transform:scaleX(1.35);opacity:1}
.nav-tick.active{background:var(--accent);opacity:1}
.nav-tick.user{background:#6b8aff55}
.nav-tick.user:hover,.nav-tick.user.active{background:#6b8aff}
.nav-tick.ai{background:#10a37f55}
.nav-tick.ai:hover,.nav-tick.ai.active{background:#10a37f}
.nav-tick.summary{background:#f5b30155}
.nav-tick.summary:hover,.nav-tick.summary.active{background:#f5b301}
.nav-tick.compare{background:linear-gradient(90deg,#6b8aff55 50%,#10a37f55 50%)}
.nav-tick.compare:hover,.nav-tick.compare.active{background:linear-gradient(90deg,#6b8aff 50%,#10a37f 50%)}
.nav-tip{position:fixed;background:var(--bg-side);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:200;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.nav-tip.show{opacity:1}
.rag-toggle{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.rag-toggle:hover{background:var(--hover)}
.rag-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rag-toggle .badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:rgba(0,0,0,.2);font-size:11px;line-height:16px;text-align:center}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-head">
    <button class="btn-new" id="newChat">＋ 新建对话</button>
    <input type="text" id="searchBox" class="search-box" placeholder="🔍 搜索标题或内容…">
    <label class="star-filter"><input type="checkbox" id="starFilter"> ⭐ 只看有收藏的对话</label>
  </div>
  <div class="side-list" id="sessionList"></div>
  <div class="side-foot">
    <button id="openSettings">⚙ 设置</button>
    <button id="exportBtn">↧ 当前JSON</button>
    <button id="exportMdBtn">↧ 当前MD</button>
    <button id="exportTxtBtn">↧ 当前TXT</button>
    <button id="backupAllBtn">↧ 备份全部</button>
    <button id="restoreAllBtn">↥ 恢复全部</button>
  </div>
</aside>

<div id="main">
  <div class="topbar">
    <button class="icon-btn" id="toggleSide" title="显示/隐藏侧栏">☰</button>
    <select id="modelSelect"><option>加载中...</option></select>
    
    <!-- 动态Skill加载下拉框 -->
    <select id="skillSelect" title="选择当前要加载的Skill"><option value="">（未加载Skill）</option></select>
    
    <button class="compare-toggle" id="compareBtn" title="开启后同时问两个模型">⚖️ 对比</button>
    
    <!-- 对比模型下拉框：移除了内联的 style="display:none"，改为由JS控制 -->
    <select id="modelSelect2"><option>模型 B</option></select>
    
    <button class="rag-toggle" id="ragBtn" title="开启后从本地知识库检索相关上下文">📚 知识库 <span class="badge" id="ragBadge">关</span></button>
    <span class="spacer"></span>
    <button class="icon-btn" id="compressBtn" title="把早期对话压缩成摘要，节省上下文">🗜️</button>
    <span id="ctxInfo"></span>
    <span id="status" style="font-size:12px;color:var(--text-dim)"><span class="status-dot"></span>就绪</span>
    <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
  </div>
  <div id="messages"></div>

<script>
let dynamicEmo = {};
const EMO_RE = /\[emo:([a-zA-Z_][a-zA-Z0-9_]*)\]/g;
function getEmoMap(){return (window.currentSkillEmo && typeof window.currentSkillEmo === "object") ? window.currentSkillEmo : {};}
function replaceEmo(text){if(!text) return text;const map=getEmoMap();return text.replace(EMO_RE, (m, key) => (map[key] !== undefined ? map[key] : m));}

function estimateTokens(t){if(!t)return 0;const c=(t.match(/[\u4e00-\u9fa5\u3040-\u30ff]/g)||[]).length;return Math.round(c*0.6+(t.length-c)*0.3)}
function contextTokens(s){if(!s)return 0;let t=0;const sys=getActiveSystemPrompt();if(sys)t+=estimateTokens(sys);for(const m of s.messages){if(m.isSummary){t+=estimateTokens(m.content);continue}if(m.compare){for(const c of m.compare)t+=estimateTokens(c.content)+estimateTokens(c.thinking||"")}else t+=estimateTokens(m.content)+estimateTokens(m.thinking||"")}return t}
function updateCtxInfo(){const s=getCurrentSession();const used=contextTokens(s);const max=cfg.num_ctx||8192;const pct=Math.round(used/max*100);const el=document.getElementById("ctxInfo");if(!el)return;el.textContent=`≈ ${used}/${max} (${pct}%)`;el.style.color=pct>85?"#e34b4b":pct>60?"#f0a020":"var(--text-dim)"}
function formatTime(ts){if(!ts)return"";const d=new Date(ts);return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}

function splitThinking(text){
  if(!text)return{thinking:"",content:""};
  if(/<think[\s>]/i.test(text)){const m=text.match(/<think[^>]*>([\s\S]*?)<\/think>([\s\S]*)/i);if(m)return{thinking:m[1].trim(),content:m[2].trim()};const m2=text.match(/<think[^>]*>([\s\S]*)/i);if(m2)return{thinking:m2[1].trim(),content:""}}
  const mT=text.match(/^\s*Thinking\.\.\.\s*\n+([\s\S]*?)\n+\s*(?:…|\.\.\.)?\s*done thinking\.?\s*\n+([\s\S]*)$/i);
  if(mT)return{thinking:mT[1].trim(),content:mT[2].trim()};
  if(/^\s*Thinking\.\.\./i.test(text))return{thinking:text.replace(/^\s*Thinking\.\.\.\s*\n?/,"").trim(),content:""};
  const mC=text.match(/^\s*\*{0,2}\s*[（(]\s*思考\s*[)）]\s*\*{0,2}\s*\n+/);
  if(mC){const after=text.slice(mC[0].length);const marks=["步骤解析","解析：","解析:","答案：","答案:","最终答案","总结：","总结:","结论：","结论:","【答案】","Answer:","Solution:"];let splitAt=-1;for(const mk of marks){const re=new RegExp("\\n\\s*\\n\\s*"+mk.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));const mm=after.match(re);if(mm&&(splitAt<0||mm.index<splitAt))splitAt=mm.index}if(splitAt>0)return{thinking:after.slice(0,splitAt).trim(),content:after.slice(splitAt).trim()};return{thinking:after.trim(),content:""}}
  return{thinking:"",content:text};
}
function getThinkAndContent(m){if(m.thinking&&m.thinking.length>0)return{thinking:m.thinking,content:m.content};return splitThinking(m.content)}

const DEFAULT_CFG={url:"http://127.0.0.1:11434",ragUrl:"http://127.0.0.1:8000",dir:"",system:"",temperature:0.7,top_p:0.9,contextRounds:20,theme:"dark",model:"",model2:"",num_ctx:8192,num_predict:1024,compareMode:false,fontSize:15,accent:"",quickPrompts:["翻译","总结","改代码"],emoMap:{},ragEnabled:false};
let cfg={...DEFAULT_CFG};
let sessions=[],currentSessionId=null,presets=[],currentPresetId="";
let folderHandle=null,generating=false,abortCtrl=null;
let userWantsAutoScroll=true,searchQuery="",editingMsgIndex=-1;
let voiceRec=null;
let drafts={};
let starFilter=false;
let quoteState=null;
let speakingBtn=null;
let navTicks=[];
let navObserver=null;
const LS={cfg:"chat_cfg",sessions:"chat_sessions",presets:"chat_presets",drafts:"chat_drafts"};

function getRagUrl(){return (cfg.ragUrl||DEFAULT_CFG.ragUrl).replace(/\/$/,"")}

function loadLocal(){
  try{Object.assign(cfg,JSON.parse(localStorage.getItem(LS.cfg)||"{}"))}catch(e){}
  try{sessions=JSON.parse(localStorage.getItem(LS.sessions)||"[]")}catch(e){sessions=[]}
  try{presets=JSON.parse(localStorage.getItem(LS.presets)||"[]")}catch(e){presets=[]}
  try{drafts=JSON.parse(localStorage.getItem(LS.drafts)||"{}")}catch(e){drafts={}}
  if(!Array.isArray(sessions))sessions=[];
  if(!Array.isArray(presets))presets=[];
  if(!drafts||typeof drafts!=="object")drafts={};
  if(!cfg.quickPrompts||!Array.isArray(cfg.quickPrompts))cfg.quickPrompts=["翻译","总结","改代码"];
  if(!cfg.emoMap||typeof cfg.emoMap!=="object"||Array.isArray(cfg.emoMap))cfg.emoMap={};
  if(!cfg.ragUrl)cfg.ragUrl=DEFAULT_CFG.ragUrl;
  if(!cfg.num_predict)cfg.num_predict=1024;
}
function saveLocal(){localStorage.setItem(LS.cfg,JSON.stringify(cfg));localStorage.setItem(LS.sessions,JSON.stringify(sessions));localStorage.setItem(LS.presets,JSON.stringify(presets));localStorage.setItem(LS.drafts,JSON.stringify(drafts))}

function draftKey(){return currentSessionId||"__none__"}
function saveDraft(){const ta=document.getElementById("input");if(!ta)return;const v=ta.value;const k=draftKey();if(v&&v.trim())drafts[k]=v;else delete drafts[k];try{localStorage.setItem(LS.drafts,JSON.stringify(drafts))}catch(e){}}
function restoreDraft(){const ta=document.getElementById("input");if(!ta)return;ta.value=drafts[draftKey()]||"";autoResize(ta);}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("chat_db",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv","readonly");const rq=tx.objectStore("kv").get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}
async function ensureFolderPermission(){if(!folderHandle)return false;const opts={mode:"readwrite"};if(await folderHandle.queryPermission(opts)==="granted")return true;if(await folderHandle.requestPermission(opts)==="granted")return true;return false}
async function saveToDisk(){if(!folderHandle)return;try{if(!(await ensureFolderPermission()))return;const f=await folderHandle.getFileHandle("conversations.json",{create:true});const w=await f.createWritable();await w.write(JSON.stringify({sessions,presets,savedAt:new Date().toISOString()},null,2));await w.close()}catch(e){}}
async function loadFromDisk(){if(!folderHandle)return false;try{if(!(await ensureFolderPermission()))return false;const f=await folderHandle.getFileHandle("conversations.json");const file=await f.getFile();const data=JSON.parse(await file.text());if(Array.isArray(data.sessions))sessions=data.sessions;if(Array.isArray(data.presets))presets=data.presets;return true}catch(e){return false}}

let allModelsCache=[];
async function fetchModels(){
  const sel=document.getElementById("modelSelect");
  const sel2=document.getElementById("modelSelect2");
  try{
    const r=await fetch(cfg.url+"/api/tags");
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    const models=(data.models||[]).map(m=>m.name);
    allModelsCache=models;
    if(!models.length){sel.innerHTML='<option value="">（无模型）</option>';setStatus("未发现模型",true);return}
    sel.innerHTML=models.map(m=>`<option value="${m}" ${m===cfg.model?"selected":""}>${m}</option>`).join("");
    if(!cfg.model||!models.includes(cfg.model)){cfg.model=models[0];sel.value=cfg.model;saveLocal()}
    
    // 填充模型B下拉框
    sel2.innerHTML='<option value="">（选模型B）</option>'+models.map(m=>`<option value="${m}" ${m===cfg.model2?"selected":""}>${m}</option>`).join("");
    if(!cfg.model2||!models.includes(cfg.model2)){cfg.model2=models.find(m=>m!==cfg.model)||models[0];sel2.value=cfg.model2;saveLocal()}
    setStatus("已连接")
  }catch(e){sel.innerHTML='<option value="">（连接失败）</option>';setStatus("连接失败，请先运行 .bat",true)}
}

function buildMessages(isContinue=false, excludeGroupId=null, ragContext=null){
  const s=getCurrentSession();if(!s)return[];
  const list=[];
  const sys=getActiveSystemPrompt();
  if(sys) list.push({role:"system",content:sys});
  if(ragContext && ragContext.trim()){
      list.push({role:"system",content:"【以下是从本地知识库检索到的参考资料，请基于这些资料回答用户的问题】\n\n"+ragContext});
  }
  const hist=s.messages.slice(-cfg.contextRounds);
  for(const m of hist){
    if(m.isSummary){list.push({role:"system",content:"【以下是之前对话的摘要，用于延续上下文，不要直接回复它】\n"+m.content});continue}
    if(m.compare){
      if(excludeGroupId&&m.groupId===excludeGroupId)continue;
      const parts=m.compare.map(c=>`【${c.model||"模型"}】\n${c.content||""}`).join("\n\n---\n\n");
      if(parts)list.push({role:"assistant",content:parts});
      continue;
    }
    if(excludeGroupId&&m.groupId===excludeGroupId)continue;
    if(m.role==="user"||m.role==="assistant")list.push({role:m.role,content:m.content});
  }
  if(isContinue)list.push({role:"user",content:"请从上面回答中断的地方**直接接着写**，不要重复已经说过的内容，不要道歉，不要重新开头。"});
  return list;
}

function getActiveSystemPrompt(){
  if(window.currentSkillPrompt && window.currentSkillPrompt.trim()){
      return window.currentSkillPrompt;
  }
  const parts=[];
  let main="";
  if(currentPresetId){
    const p=presets.find(x=>x.id===currentPresetId);
    if(p)main=p.prompt||"";
  }else{
    main=cfg.system||"";
  }
  if(main)parts.push(main);
  return parts.join("\n\n---\n\n");
}

async function streamRequest(model,messages,onChunk,onDone,onError,signal){
  try{
    const body={model,messages,stream:true,options:{temperature:cfg.temperature,top_p:cfg.top_p,num_ctx:cfg.num_ctx||8192,num_predict:cfg.num_predict||1024,repeat_penalty:1.15,repeat_last_n:256,stop:["<|im_end|>","\n用户：","\n\n用户："]}};
    const r=await fetch(cfg.url+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal});
    if(!r.ok){let d="";try{const j=await r.json();d=j.error||JSON.stringify(j)}catch(e){}throw new Error("HTTP "+r.status+(d?"："+d:""))}
    const reader=r.body.getReader();const decoder=new TextDecoder();let buf="";
    while(true){
      const{value,done}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
        if(!line)continue;
        try{const obj=JSON.parse(line);if(obj.message)onChunk(obj.message)}catch(e){}
      }
    }
    onDone&&onDone()
  }catch(e){
    if(e.name==="AbortError"){onError&&onError(e,true)}
    else{onError&&onError(e,false)}
  }
}

async function runStream(aiMsg,isContinue=false,targetModel=null,groupId=null,groupIdToExclude=null,ragContext=null){
  const s=getCurrentSession();
  const model=targetModel||cfg.model;
  const msgs=buildMessages(isContinue,groupIdToExclude,ragContext);
  abortCtrl=abortCtrl||new AbortController();
  const startTime=Date.now();
  setStatus(isContinue?"继续生成中…":"生成中…");
  await streamRequest(model,msgs,
    (msg)=>{
        if(msg.thinking)aiMsg.thinking+=msg.thinking;
        if(msg.content)aiMsg.content+=msg.content;
        streamUpdate()
    },
    ()=>{
      const elapsed=(Date.now()-startTime)/1000;
      const total=estimateTokens(aiMsg.content+(aiMsg.thinking||""));
      aiMsg.speed=elapsed>0.5?(total/elapsed):0;
      aiMsg.genTime=elapsed;
      s.updatedAt=Date.now();saveLocal();saveToDisk();
    },
    (e,aborted)=>{if(aborted)setStatus("已停止");else{aiMsg.content+=`\n\n> ⚠️ 出错：${e.message}`;setStatus("出错",true)}},
    abortCtrl.signal
  );
}

function setCompareMode(on){
  cfg.compareMode = !!on;
  const btn = document.getElementById("compareBtn");
  const sel2 = document.getElementById("modelSelect2");
  if(btn) btn.classList.toggle("on", cfg.compareMode);
  
  // 修复：直接控制display属性，避免被内联样式覆盖
  if(sel2) sel2.style.display = cfg.compareMode ? "inline-block" : "none";
  
  saveLocal();
  console.log("[本地客户端] setCompareMode:", cfg.compareMode, "| model =", cfg.model, "| model2 =", cfg.model2);
}

async function fetchRagContext(query) {
    try {
        const url = `${getRagUrl()}/api/search?query=${encodeURIComponent(query)}&top_k=3`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
            const contextText = data.results.map(r => `[来源: ${r.source || '未知'}]\n${r.content}`).join("\n\n---\n\n");
            return { context: contextText, safety_flag: data.safety_flag };
        }
    } catch (e) {
        console.error("⚠️ RAG 检索失败:", e);
    }
    return null;
}
function toggleStar(idx) {
    const s = getCurrentSession();
    if (!s || !s.messages[idx]) return;
    s.messages[idx].starred = !s.messages[idx].starred;
    s.updatedAt = Date.now();
    saveLocal();
    saveToDisk();
    renderMessages();
    renderSessions();
}

function quoteMessage(idx) {
    const s = getCurrentSession();
    if (!s || !s.messages[idx]) return;
    const m = s.messages[idx];
    let text = m.content || "";
    if (m.compare) {
        text = m.compare.map(c => c.content || "").join("\n");
    }
    quoteState = { text: text.slice(0, 500), idx: idx };
    renderQuotePreview();
    const input = document.getElementById("input");
    if (input) input.focus();
}

function clearQuote() {
    quoteState = null;
    renderQuotePreview();
}

function renderQuotePreview() {
    const box = document.getElementById("quotePreview");
    if (!box) return;
    if (!quoteState) {
        box.innerHTML = "";
        box.classList.remove("show");
        return;
    }
    box.classList.add("show");
    box.innerHTML = `<div class="quote-bar"><div class="quote-inner"><div class="quote-head">引用消息</div><div class="quote-text">${escapeHtml(quoteState.text)}</div></div><button class="quote-close" onclick="clearQuote()">×</button></div>`;
}

function speakMessage(text, btn) {
    if (!text) return;
    if (!window.speechSynthesis) { alert("你的浏览器不支持语音朗读。"); return; }
    if (speakingBtn === btn) {
        window.speechSynthesis.cancel();
        btn.classList.remove("speaking");
        speakingBtn = null;
        return;
    }
    window.speechSynthesis.cancel();
    if (speakingBtn) speakingBtn.classList.remove("speaking");
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN";
    utter.onend = () => { btn.classList.remove("speaking"); speakingBtn = null; };
    utter.onerror = () => { btn.classList.remove("speaking"); speakingBtn = null; };
    speakingBtn = btn;
    btn.classList.add("speaking");
    window.speechSynthesis.speak(utter);
}

function switchVersion(m, dir) {
    if (!m.versions || m.versions.length <= 1) return;
    const cur = m.currentVersion || 0;
    const next = Math.max(0, Math.min(m.versions.length - 1, cur + dir));
    if (next === cur) return;
    m.currentVersion = next;
    const v = m.versions[next];
    m.model = v.model;
    m.content = v.content;
    m.thinking = v.thinking || "";
    m.time = v.time;
    m.speed = v.speed;
    renderMessages();
    saveLocal();
    saveToDisk();
}

async function compressContext(){

  const s=getCurrentSession();
  if(!s||s.messages.length<6){alert("消息太少，无需压缩");return}
  const keepCount=6;
  const toSummarize=s.messages.slice(0,-keepCount);
  const toKeep=s.messages.slice(-keepCount);
  if(toSummarize.length<2){alert("可压缩的消息太少");return}
  if(!confirm(`将把前 ${toSummarize.length} 条消息压缩成一段摘要（用当前模型 ${cfg.model}），继续？`))return;
  const lines=[];
  for(const m of toSummarize){
    if(m.isSummary){lines.push("【之前摘要】"+m.content);continue}
    if(m.compare){lines.push("【AI】"+m.compare.map(c=>c.content).join("\n---\n"));continue}
    if(m.role==="user")lines.push("【用户】"+m.content);
    else if(m.role==="assistant")lines.push("【AI】"+m.content);
  }
  const prompt="请把下面这段对话总结成简洁的要点，保留关键信息、结论、用户偏好和未解决的问题。只输出总结本身，不要寒暄，不要加代码块围栏。\n\n"+lines.join("\n\n");
  generating=true;updateSendBtn();abortCtrl=new AbortController();
  setStatus("正在生成摘要…");
  let summary="";
  await streamRequest(cfg.model,[{role:"system",content:"你是对话总结助手，输出简洁要点。"},{role:"user",content:prompt}],(msg)=>{if(msg.content)summary+=msg.content},()=>{},(e,aborted)=>{if(!aborted)summary="";},abortCtrl.signal);
  generating=false;abortCtrl=null;updateSendBtn();
  if(!summary.trim()){setStatus("压缩失败",true);return}
  s.messages=[{role:"assistant",isSummary:true,content:summary.trim(),time:Date.now(),model:cfg.model},...toKeep];
  s.updatedAt=Date.now();
  saveLocal();saveToDisk();renderMessages();updateCtxInfo();
  setStatus("已压缩");
}

function copyText(text,btn){
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{const old=btn.textContent;btn.textContent="✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent=old;btn.classList.remove("ok")},1200)}).catch(()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");btn.textContent="✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="📋";btn.classList.remove("ok")},1200)}catch(e){}
    document.body.removeChild(ta);
  });
}

function renderMarkdown(text){if(!text)return"";text=replaceEmo(text);let html;try{html=marked.parse(text,{breaks:true,gfm:true})}catch(e){html=escapeHtml(text)}return DOMPurify.sanitize(html,{ADD_ATTR:["target"]})}
function postRender(container){
  container.querySelectorAll("pre code").forEach(codeEl=>{
    if(!codeEl.dataset.done){try{hljs.highlightElement(codeEl)}catch(e){}codeEl.dataset.done="1"}
    const pre=codeEl.parentElement;
    if(pre.parentElement&&pre.parentElement.classList.contains("code-block"))return;
    const lang=(codeEl.className.match(/language-(\w+)/)||[])[1]||"text";
    const block=document.createElement("div");block.className="code-block";const head=document.createElement("div");head.className="code-head";
    head.innerHTML=`<span>${lang}</span><button class="code-copy">复制</button>`;
    pre.parentNode.insertBefore(block,pre);block.appendChild(head);block.appendChild(pre);
    head.querySelector(".code-copy").onclick=()=>{navigator.clipboard.writeText(codeEl.innerText).then(()=>{const b=head.querySelector(".code-copy");b.textContent="已复制 ✓";setTimeout(()=>b.textContent="复制",1500)})};
  });
  try{renderMathInElement(container,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false})}catch(e){}
}

function buildMessageInner(m,isStreamingLast,idx){

  const isEditing=isUser&&idx===editingMsgIndex;
  if(isEditing){return `<div><div class="msg-role">✏️ 编辑消息</div><textarea class="edit-area">${escapeHtml(m.content)}</textarea><div class="edit-actions"><button class="edit-cancel">取消</button><button class="edit-save primary">保存并重新发送</button></div></div>`;}
  if(m.isSummary){return `<div class="msg"><div class="avatar ai">📝</div><div class="msg-body"><div class="msg-role">上下文摘要（已压缩） ${formatTime(m.time)}<span class="compress-info">压缩后节省上下文</span></div><div class="msg-content">${renderMarkdown(m.content)}</div></div></div>`;}
  const timeStr=formatTime(m.time);const timeHtml=timeStr?`<span class="msg-time">${timeStr}</span>`:"";
  const starredCls=m.starred?" starred":"";
  const starBtn=`<button class="msg-fbtn star-btn${starredCls}" title="${m.starred?"取消收藏":"收藏"}">⭐</button>`;
  const delBtn=`<button class="msg-fbtn del-btn" title="删除这条消息">🗑</button>`;
  const quoteBtn=`<button class="msg-fbtn quote-btn" title="引用这条消息">💬</button>`;
  if(isUser){
    const floatBtns=`<div class="msg-float"><button class="msg-fbtn copy-btn" title="复制">📋</button><button class="msg-fbtn edit-btn" title="编辑">✏️</button>${quoteBtn}${starBtn}${delBtn}</div>`;
    return `${floatBtns}<div class="msg"><div class="avatar user">你</div><div class="msg-body"><div class="msg-role">你 ${m.starred?'<span style="color:#f5b301">★</span>':''} ${timeHtml}</div><div class="msg-content">${renderMarkdown(m.content)}</div></div></div>`;
  }
  if(m.compare){
    const c0=m.compare[0],c1=m.compare[1];
    const t0=estimateTokens(c0.content+(c0.thinking||"")),t1=estimateTokens(c1.content+(c1.thinking||""));
    const tokensHtml=`<span class="msg-tokens">≈ ${t0} / ${t1} token</span>`;
    const colHtml=(c)=>{const {thinking,content}=getThinkAndContent(c);const thinkHtml=thinking?`<div class="think-box"><div class="think-head"><span class="think-arrow"></span><span class="think-label">深度思考</span><span class="think-meta">${thinking.length} 字</span></div><div class="think-content">${escapeHtml(thinking)}</div></div>`:"";return `<div class="compare-col"><div class="compare-head"><span class="dot"></span>${escapeHtml(c.model)}<span style="margin-left:auto;display:flex;gap:4px"><button class="msg-fbtn cmp-copy" style="width:24px;height:24px;font-size:11px" title="复制这条回答">📋</button><button class="msg-fbtn cmp-export" style="width:24px;height:24px;font-size:11px" title="导出这条回答 (.md)">↧</button></span></div>${thinkHtml}<div class="msg-content">${renderMarkdown(content)}</div></div>`;};
    const floatBtns=`<div class="msg-float">${quoteBtn}${starBtn}${delBtn}</div>`;
    return `${floatBtns}<div class="msg"><div class="avatar ai">⚖️</div><div class="msg-body"><div class="msg-role">模型对比 ${tokensHtml} ${m.starred?'<span style="color:#f5b301">★</span>':''} ${timeHtml}</div><div class="msg-compare">${colHtml(c0)}${colHtml(c1)}</div></div></div>`;
  }
  const tokens=estimateTokens(m.content+(m.thinking||""));
  let tokenInfo=tokens?`≈ ${tokens} token`:"";
  if(m.speed&&m.speed>0)tokenInfo+=` · ${m.speed.toFixed(1)} tok/s`;
  const msgTokens=tokenInfo?`<span class="msg-tokens">${tokenInfo}</span>`:"";
  let versionNav="";

    const cur=(m.currentVersion||0)+1;const total=m.versions.length;
    versionNav=`<span class="version-nav"><button class="ver-prev" title="上一个版本" ${m.currentVersion<=0?"disabled":""}>◀</button><span>${cur} / ${total}</span><button class="ver-next" title="下一个版本" ${m.currentVersion>=total-1?"disabled":""}>▶</button></span>`;
  }
  const body=renderAiBody(m,isStreamingLast);
  let actions="";
  if(isStreamingLast&&!generating&&(m.content||m.thinking)){
    actions=`<div class="msg-actions"><button class="msg-action continue-btn" title="继续写">▶ 继续生成</button><button class="msg-action regen-btn" title="重新生成">🔄 重新生成</button><button class="msg-action branch-btn" title="从这一刻创建分支">🌿 分叉</button></div>`;
  }
  const floatBtns=`<div class="msg-float"><button class="msg-fbtn copy-btn" title="复制">📋</button><button class="msg-fbtn speak-btn" title="朗读这条回答">🔊</button>${quoteBtn}${starBtn}${delBtn}<button class="msg-fbtn export-one-btn" title="导出这条回答 (.md)">↧</button></div>`;
  return `${floatBtns}<div class="msg"><div class="avatar ai">AI</div><div class="msg-body"><div class="msg-role">${escapeHtml(m.model||cfg.model||"AI")} ${msgTokens} ${versionNav} ${m.starred?'<span style="color:#f5b301">★</span>':''} ${timeHtml}</div>${body}${actions}</div></div>`;
}

function getMsgPreview(m){if(!m)return"";if(m.isSummary)return"【摘要】"+(m.content||"").slice(0,60);if(m.compare){const t=(m.compare[0]&&m.compare[0].content)||"";return"【对比】"+replaceEmo(t).slice(0,60);}if(m.role==="user")return"你："+replaceEmo(m.content||"").slice(0,60);return"AI："+replaceEmo(m.content||"").slice(0,60);}
function renderMsgNav(){
  const nav=document.getElementById("msgNav");const s=getCurrentSession();nav.innerHTML="";navTicks=[];
  if(navObserver){navObserver.disconnect();navObserver=null}
  if(!s||!s.messages.length){nav.classList.remove("show");return}
  if(s.messages.length<3){nav.classList.remove("show");return}
  nav.classList.add("show");
  s.messages.forEach((m,i)=>{
    const tick=document.createElement("div");let cls="nav-tick";
    if(m.isSummary)cls+=" summary";else if(m.compare)cls+=" compare";else if(m.role==="user")cls+=" user";else cls+=" ai";
    tick.className=cls;tick.dataset.idx=i;tick.title="";
    tick.onclick=()=>{const wrap=document.querySelector(`.msg-wrap[data-idx="${i}"]`);if(wrap){userWantsAutoScroll=false;updateJumpBtn();wrap.scrollIntoView({behavior:"smooth",block:"start"})}};
    tick.onmouseenter=(e)=>{
      const tip=document.getElementById("navTip");const text=getMsgPreview(m);if(!text){tip.classList.remove("show");return}
      tip.textContent=text;const rect=tick.getBoundingClientRect();tip.style.left=Math.max(8,rect.left-tip.offsetWidth-8)+"px";tip.style.top=Math.max(8,rect.top+rect.height/2-14)+"px";tip.classList.add("show");
      requestAnimationFrame(()=>{const r2=tick.getBoundingClientRect();tip.style.left=Math.max(8,r2.left-tip.offsetWidth-10)+"px";tip.style.top=Math.max(8,Math.min(window.innerHeight-40,r2.top+r2.height/2-14))+"px";});
    };
    tick.onmouseleave=()=>{document.getElementById("navTip").classList.remove("show")};
    nav.appendChild(tick);navTicks.push(tick);
  });
  setupNavObserver();
}
function setupNavObserver(){
  if(navObserver){navObserver.disconnect()}if(!navTicks.length)return;
  const root=document.getElementById("messages");
  navObserver=new IntersectionObserver((entries)=>{entries.forEach(en=>{const idx=en.target.dataset.idx;if(idx===undefined)return;const tick=navTicks[parseInt(idx)];if(!tick)return;if(en.isIntersecting)tick.classList.add("active");else tick.classList.remove("active");});},{root:root,threshold:0.3});
  document.querySelectorAll("#messages .msg-wrap").forEach(w=>navObserver.observe(w));
}
function updateNavActiveOnScroll(){
  if(!navTicks.length)return;let anyActive=false;
  for(const t of navTicks){if(t.classList.contains("active")){anyActive=true;break}}
  if(anyActive)return;
  const box=document.getElementById("messages");const wraps=box.querySelectorAll(".msg-wrap");const top=box.getBoundingClientRect().top;let best=-1,bestDist=Infinity;
  wraps.forEach(w=>{const r=w.getBoundingClientRect();const d=Math.abs(r.top-top);if(d<bestDist){bestDist=d;best=parseInt(w.dataset.idx)}});
  navTicks.forEach(t=>t.classList.remove("active"));if(best>=0&&navTicks[best])navTicks[best].classList.add("active");
}

function renderMessages(){
  const box=document.getElementById("messages");const s=getCurrentSession();
  if(!s||!s.messages.length){box.innerHTML=`<div style="text-align:center;color:var(--text-dim);margin-top:80px;font-size:15px;"><div style="font-size:40px;margin-bottom:10px">💬</div>开始一个新的对话吧</div>`;renderMsgNav();updateCtxInfo();return;}
  box.innerHTML="";const rendered=new Set();
  s.messages.forEach((m,i)=>{
    if(rendered.has(i))return;
    const wrap=document.createElement("div");wrap.className="msg-wrap";wrap.dataset.idx=i;
    const isLast=i===s.messages.length-1;if(isLast)wrap.dataset.last="1";
    if(m.isSummary){wrap.classList.add("summary");wrap.innerHTML=buildMessageInner(m,false,i);}
    else if(m.groupId&&m.role==="assistant"){
      const nextIdx=i+1;
      if(nextIdx<s.messages.length&&s.messages[nextIdx].groupId===m.groupId){
        rendered.add(nextIdx);wrap.classList.add("wide");
        const tmp={role:"assistant",compare:[{model:m.model,content:m.content,thinking:m.thinking},{model:s.messages[nextIdx].model,content:s.messages[nextIdx].content,thinking:s.messages[nextIdx].thinking}],time:m.time,starred:m.starred};
        wrap.innerHTML=buildMessageInner(tmp,false,i);
      }else{wrap.innerHTML=buildMessageInner(m,isLast,i);}
    }else{wrap.innerHTML=buildMessageInner(m,isLast,i);}
    box.appendChild(wrap);postRender(wrap);bindMsgActions(wrap,m,i);
  });
  if(userWantsAutoScroll)scrollToBottom();renderMsgNav();updateCtxInfo();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function scrollToBottom(){const box=document.getElementById("messages");box.scrollTop=box.scrollHeight}

function togglePinSession(id,ev){ev.stopPropagation();const s=sessions.find(x=>x.id===id);if(!s)return;s.pinned=!s.pinned;s.updatedAt=Date.now();saveLocal();saveToDisk();renderSessions();}
function startRenameSession(id){
  const el=document.querySelector(`.session-item[data-id="${id}"]`);if(!el)return;
  const titleSpan=el.querySelector(".session-title");if(!titleSpan)return;
  const s=sessions.find(x=>x.id===id);if(!s)return;
  const inp=document.createElement("input");inp.type="text";inp.className="session-rename-input";inp.value=s.title||"";titleSpan.replaceWith(inp);inp.focus();inp.select();
  let done=false;const finish=(saveIt)=>{if(done)return;done=true;if(saveIt){const v=inp.value.trim();if(v){s.title=v;s.updatedAt=Date.now();saveLocal();saveToDisk()}}renderSessions();};
  inp.onclick=(e)=>e.stopPropagation();inp.ondblclick=(e)=>e.stopPropagation();inp.onblur=()=>finish(true);

function sessionMatches(s,q){if(!q)return true;if((s.title||"").toLowerCase().includes(q))return true;for(const m of (s.messages||[])){if(m.compare){for(const c of m.compare){if((c.content||"").toLowerCase().includes(q))return true;if((c.thinking||"").toLowerCase().includes(q))return true}}else{if((m.content||"").toLowerCase().includes(q))return true;if((m.thinking||"").toLowerCase().includes(q))return true}}return false;}
function sessionHitCount(s,q){if(!q)return 0;let n=0;for(const m of (s.messages||[])){if(m.compare){for(const c of m.compare){if((c.content||"").toLowerCase().includes(q))n++}}else{if((m.content||"").toLowerCase().includes(q))n++}}return n;}
function renderSessions(){
  const box=document.getElementById("sessionList");const q=searchQuery.trim().toLowerCase();
  let list=sessions.filter(s=>sessionMatches(s,q));if(starFilter)list=list.filter(s=>(s.messages||[]).some(m=>m.starred));
  list.sort((a,b)=>{const pa=a.pinned?1:0,pb=b.pinned?1:0;if(pa!==pb)return pb-pa;return (b.updatedAt||0)-(a.updatedAt||0);});
  if(!list.length){box.innerHTML=q?'<div style="padding:14px;font-size:13px;color:var(--text-dim)">没有匹配的对话</div>':'<div style="padding:14px;font-size:13px;color:var(--text-dim)">暂无对话</div>';return;}
  box.innerHTML=list.map(s=>{
    const hit=(q&&!(s.title||"").toLowerCase().includes(q))?sessionHitCount(s,q):0;
    const hitHtml=hit>0?`<span class="session-hit" title="正文中匹配 ${hit} 条">正文×${hit}</span>`:"";
    const hasStar=(s.messages||[]).some(m=>m.starred);const starMark=hasStar?'<span class="session-star" title="有收藏消息">★</span>':'';
    const pinCls=s.pinned?" pinned":"";
    return `<div class="session-item ${s.id===currentSessionId?"active":""}" data-id="${s.id}" title="双击标题重命名 · 单击打开"><span class="session-pin${pinCls}" data-pin="${s.id}" title="${s.pinned?'取消置顶':'置顶对话'}">📌</span><span class="session-title">${escapeHtml(s.title)}${hitHtml}${starMark}</span><span class="session-del" data-del="${s.id}">×</span></div>`;
  }).join("");
  box.querySelectorAll(".session-item").forEach(el=>{el.onclick=()=>{switchSession(el.dataset.id);if(q)setTimeout(()=>jumpToSearchHit(el.dataset.id,q),150)};el.ondblclick=(e)=>{e.stopPropagation();startRenameSession(el.dataset.id)};});
  box.querySelectorAll(".session-pin").forEach(el=>el.onclick=(ev)=>togglePinSession(el.dataset.pin,ev));
  box.querySelectorAll(".session-del").forEach(el=>el.onclick=(ev)=>deleteSession(el.dataset.del,ev));

async function importPresetFolder(){
  try{
    const dir=await window.showDirectoryPicker({mode:"read"});
    const allFiles=[];
    for await(const entry of dir.values()){
      if(entry.kind==="file"){
        const nm=entry.name.toLowerCase();
        if(/\.(md|markdown|txt|text)$/i.test(nm)){const f=await entry.getFile();if(f.size>500*1024)continue;allFiles.push({name:entry.name,file:f})}
      }
    }
    if(!allFiles.length){alert("没有 .md / .txt 文件。");return}
    let chosen=allFiles.filter(x=>/^skill\.(md|markdown|txt)$/i.test(x.name));
    if(!chosen.length){
      const blacklist=/^(license|licence|changelog|contributing|security|code_of_conduct|code-of-conduct|gitignore|\.gitignore)/i;
      chosen=allFiles.filter(x=>!blacklist.test(x.name));
      chosen.sort((a,b)=>(/^readme/i.test(a.name)?1:0)-(/^readme/i.test(b.name)?1:0));
    }
    const used=chosen.slice(0,3);
    let combined="";
    for(const item of used){const txt=await item.file.text();if(used.length>1)combined+=`\n\n### 来自 ${item.name}\n${txt}`;else combined+=txt}
    const name=prompt("给这个预设起个名字：",dir.name);if(!name)return;
    presets.push({id:"p"+Date.now(),name,prompt:combined.trim()});
    saveLocal();saveToDisk();renderPresets();
    alert("导入成功！共读取 " + used.length + " 个文件：" + used.map(x=>"\n• "+x.name).join("") + "\n\n总字数：" + combined.length)
  }catch(e){if(e.name!=="AbortError")alert("失败："+e.message)}
}

  document.getElementById("cfgRagUrl").value=cfg.ragUrl||DEFAULT_CFG.ragUrl;
  document.getElementById("cfgDir").value=cfg.dir||"（未选择）";document.getElementById("cfgSys").value=cfg.system||"";
  document.getElementById("cfgTemp").value=cfg.temperature;document.getElementById("tempVal").textContent=cfg.temperature;
  document.getElementById("cfgTopP").value=cfg.top_p;document.getElementById("toppVal").textContent=cfg.top_p;
  document.getElementById("cfgCtx").value=cfg.contextRounds;document.getElementById("cfgNumCtx").value=cfg.num_ctx||8192;
  document.getElementById("cfgNumPredict").value=cfg.num_predict||1024;
  document.getElementById("cfgFontSize").value=cfg.fontSize||15;document.getElementById("fontSizeVal").textContent=cfg.fontSize||15;
  const accent=cfg.accent||"#4d6bfe";document.getElementById("cfgAccent").value=accent;
  document.querySelectorAll("#accentPicker .color-swatch").forEach(s=>s.classList.toggle("active",s.dataset.color.toLowerCase()===accent.toLowerCase()));
  renderTplList();renderEmoList();renderPresets();document.getElementById("settingsMask").classList.add("show");
}
function closeSettings(){document.getElementById("settingsMask").classList.remove("show")}
function saveSettings(){
  cfg.url=document.getElementById("cfgUrl").value.trim().replace(/\/$/,"")||DEFAULT_CFG.url;
  cfg.ragUrl=document.getElementById("cfgRagUrl").value.trim().replace(/\/$/,"")||DEFAULT_CFG.ragUrl;
  cfg.system=document.getElementById("cfgSys").value;
  cfg.temperature=parseFloat(document.getElementById("cfgTemp").value);cfg.top_p=parseFloat(document.getElementById("cfgTopP").value);
  cfg.contextRounds=parseInt(document.getElementById("cfgCtx").value)||20;cfg.num_ctx=parseInt(document.getElementById("cfgNumCtx").value)||8192;
  cfg.num_predict=parseInt(document.getElementById("cfgNumPredict").value)||1024;
  cfg.fontSize=parseInt(document.getElementById("cfgFontSize").value)||15;cfg.accent=document.getElementById("cfgAccent").value||"";
  saveLocal();applyFontSize();applyAccentColor();closeSettings();fetchModels();updateCtxInfo();
}
function applyFontSize(){document.documentElement.style.setProperty('--font-size',(cfg.fontSize||15)+"px")}
function darkenHex(hex,amt){try{const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.round(r*(1-amt)));g=Math.max(0,Math.round(g*(1-amt)));b=Math.max(0,Math.round(b*(1-amt)));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}catch(e){return hex}}
function lightenHex(hex,amt){try{const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.min(255,Math.round(r+(255-r)*amt));g=Math.min(255,Math.round(g+(255-g)*amt));b=Math.min(255,Math.round(b+(255-b)*amt));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}catch(e){return hex}}
function applyAccentColor(){const c=cfg.accent||"";if(!c){document.documentElement.style.removeProperty("--accent");document.documentElement.style.removeProperty("--accent-hover");return}const hover=cfg.theme==="dark"?lightenHex(c,.15):darkenHex(c,.1);document.documentElement.style.setProperty("--accent",c);document.documentElement.style.setProperty("--accent-hover",hover);}

async function pickFolder(){try{const h=await window.showDirectoryPicker({mode:"readwrite",id:"chatDataDir"});folderHandle=h;cfg.dir=h.name;document.getElementById("cfgDir").value=h.name;await idbSet("folderHandle",h);saveLocal();const loaded=await loadFromDisk();if(loaded){renderSessions();renderMessages();renderPresets()}await saveToDisk();alert("已绑定："+h.name)}catch(e){if(e.name!=="AbortError")alert("失败："+e.message)}}
function setStatus(txt,err){document.getElementById("status").innerHTML=`<span class="status-dot${err?" err":""}"></span>${escapeHtml(txt)}`}
function updateSendBtn(){const b=document.getElementById("sendBtn");if(generating){b.textContent="■ 停止";b.classList.add("stop")}else{b.textContent="发送";b.classList.remove("stop")}}
function autoResize(ta){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,220)+"px"}
function applyTheme(){document.documentElement.dataset.theme=cfg.theme;document.getElementById("themeToggle").textContent=cfg.theme==="dark"?"☀️":"🌙";document.getElementById("hljs-dark").disabled=cfg.theme!=="dark";document.getElementById("hljs-light").disabled=cfg.theme==="dark";applyAccentColor();}

function renderQuickPrompts(){
  const box=document.getElementById("quickPrompts");if(!box)return;
  if(!cfg.quickPrompts||!cfg.quickPrompts.length){box.innerHTML="";return}
  box.innerHTML=cfg.quickPrompts.map(p=>`<button class="quick-btn">${escapeHtml(p)}</button>`).join("");
  box.querySelectorAll(".quick-btn").forEach(btn=>{
    btn.onclick=()=>{
      const input=document.getElementById("input");const prompt=btn.textContent;
      if(prompt==="翻译")input.value=input.value?`请将以下内容翻译成中文：\n\n${input.value}`:"请将以下内容翻译成中文：\n\n";
      else if(prompt==="总结")input.value=input.value?`请总结以下内容：\n\n${input.value}`:"请总结以下内容：\n\n";
      else if(prompt==="改代码")input.value=input.value?`请优化以下代码：\n\n${input.value}`:"请优化以下代码：\n\n";
      else input.value=input.value?`${prompt}\n\n${input.value}`:`${prompt}\n\n`;
      autoResize(input);saveDraft();input.focus();
    };
  });
}

function bindKeyboardShortcuts(){
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey&&e.key.toLowerCase()==="n"){e.preventDefault();if(generating){alert("生成中");return}createSession();renderMessages();return}
    if(e.ctrlKey&&e.key.toLowerCase()==="k"){e.preventDefault();const inp=document.getElementById("input");inp.value="";autoResize(inp);saveDraft();inp.focus();return}
    if(e.ctrlKey&&e.key===","){e.preventDefault();openSettings();return}
    if(e.key==="Escape"){
      if(document.getElementById("regenModelMask").classList.contains("show")){closeRegenModelModal();return}
      if(quoteState){clearQuote();return}
      if(editingMsgIndex>=0){cancelEdit();return}
      if(generating&&abortCtrl)abortCtrl.abort();
    }
  });
}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("你的浏览器不支持语音识别。请用 Chrome 或 Edge 打开。");return}
  const btn=document.getElementById("micBtn");
  if(voiceRec){try{voiceRec.stop()}catch(e){}voiceRec=null;btn.classList.remove("recording");return}
  voiceRec=new SR();voiceRec.lang="zh-CN";voiceRec.continuous=true;voiceRec.interimResults=true;
  const input=document.getElementById("input");let baseText=input.value;
  voiceRec.onresult=(e)=>{let final="",interim="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;}if(final)baseText+=final;input.value=baseText+interim;autoResize(input);saveDraft();};
  voiceRec.onerror=(e)=>{if(e.error==="not-allowed")alert("麦克风权限被拒绝。请在浏览器地址栏左侧点🔒图标允许麦克风访问。");voiceRec=null;btn.classList.remove("recording");};
  voiceRec.onend=()=>{voiceRec=null;btn.classList.remove("recording")};
  try{voiceRec.start();btn.classList.add("recording")}catch(e){alert("启动失败："+e.message);voiceRec=null}
}

async function init(){
  window.currentSkillEmo = window.currentSkillEmo || {};
  loadLocal();
  if(!cfg.theme)cfg.theme="dark";if(!cfg.num_ctx)cfg.num_ctx=8192;if(!cfg.num_predict)cfg.num_predict=1024;if(!cfg.fontSize)cfg.fontSize=15;
  if(!cfg.quickPrompts)cfg.quickPrompts=["翻译","总结","改代码"];
  if(cfg.ragEnabled===undefined)cfg.ragEnabled=false;
  if(!cfg.ragUrl)cfg.ragUrl=DEFAULT_CFG.ragUrl;
  applyFontSize();applyTheme();

  // 拉取文件夹
  try{const h=await idbGet("folderHandle");if(h){folderHandle=h;cfg.dir=h.name;const ok=await ensureFolderPermission().catch(()=>false);if(ok)await loadFromDisk()}}catch(e){}

  // 拉取 Skill 列表
  try {
    const skillRes = await fetch(`${getRagUrl()}/api/skills`);
    const skillData = await skillRes.json();
    const skillSel = document.getElementById("skillSelect");
    if (skillData && skillData.skills && skillData.skills.length > 0) {
      skillSel.innerHTML = '<option value="">（未加载Skill）</option>' +
        skillData.skills.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
    }
  } catch(e) {console.warn("⚠️ 无法连接后端获取 Skill 列表");}

  renderSessions();renderPresets();renderMessages();renderQuickPrompts();updateRagBadge();restoreDraft();bindScrollWatcher();bindKeyboardShortcuts();
  setCompareMode(cfg.compareMode || false);

  document.getElementById("newChat").onclick=()=>{if(generating){alert("生成中");return}createSession();renderMessages()};
  let searchTimer=null;
  document.getElementById("searchBox").addEventListener("input",e=>{clearTimeout(searchTimer);const v=e.target.value;searchTimer=setTimeout(()=>{searchQuery=v;renderSessions();},200);});
  document.getElementById("starFilter").addEventListener("change",e=>{starFilter=e.target.checked;renderSessions()});
  document.getElementById("toggleSide").onclick=()=>document.getElementById("sidebar").classList.toggle("hide");
  document.getElementById("themeToggle").onclick=()=>{cfg.theme=cfg.theme==="dark"?"light":"dark";saveLocal();applyTheme()};
  document.getElementById("openSettings").onclick=openSettings;
  document.getElementById("settingsMask").onclick=(e)=>{if(e.target.id==="settingsMask")closeSettings()};
  document.getElementById("presetMask").onclick=(e)=>{if(e.target.id==="presetMask")closePresetEdit()};
  document.getElementById("regenModelMask").onclick=(e)=>{if(e.target.id==="regenModelMask")closeRegenModelModal()};
  document.getElementById("cfgTemp").oninput=e=>document.getElementById("tempVal").textContent=e.target.value;
  document.getElementById("cfgTopP").oninput=e=>document.getElementById("toppVal").textContent=e.target.value;
  document.getElementById("cfgFontSize").oninput=e=>document.getElementById("fontSizeVal").textContent=e.target.value;
  
  document.getElementById("modelSelect").onchange=e=>{cfg.model=e.target.value;saveLocal()};
  document.getElementById("modelSelect2").onchange=e=>{cfg.model2=e.target.value;saveLocal()};
  
  // === 核心：Skill 加载逻辑 ===
  document.getElementById("skillSelect").onchange = async (e) => {
      const skillId = e.target.value;
      if (!skillId) {
          window.currentSkillPrompt = "";
          window.currentSkillEmo = {};
          setStatus("已卸载 Skill");
          return;
      }
      try {
          setStatus("正在加载 Skill...");
          const res = await fetch(`${getRagUrl()}/api/skill_content?skill_id=${encodeURIComponent(skillId)}`);
          const data = await res.json();
          if (data.content) {
              window.currentSkillPrompt = data.content;
              window.currentSkillEmo = data.emoji || {};
              const _emoCount = Object.keys(window.currentSkillEmo).length;
              setStatus(`已加载 Skill: ${data.name}${_emoCount ? ` (颜文字 ${_emoCount})` : ''}`);
              console.log(`[客户端] 成功加载 Skill: ${data.name}，颜文字 ${_emoCount} 个`);
          } else {
              window.currentSkillPrompt = "";
              window.currentSkillEmo = {};
              setStatus("加载 Skill 失败", true);
          }
      } catch (err) {
          console.error(err);
          setStatus("请求 Skill 内容失败", true);
      }
  };
  
  document.getElementById("exportBtn").onclick=()=>{const s=getCurrentSession();if(!s){alert("没有对话");return}const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(s.title||"对话")+".json";a.click();URL.revokeObjectURL(a.href)};
  document.getElementById("exportMdBtn").onclick=exportMarkdown;
  document.getElementById("exportTxtBtn").onclick=exportTxt;
  document.getElementById("backupAllBtn").onclick=backupAll;
  document.getElementById("restoreAllBtn").onclick=()=>document.getElementById("restoreFile").click();
  document.getElementById("restoreFile").onchange=async(e)=>{const f=e.target.files[0];if(f)await restoreAll(f);e.target.value=""};
  document.getElementById("micBtn").onclick=toggleVoice;
  document.getElementById("compressBtn").onclick=compressContext;
  document.getElementById("compareBtn").onclick=()=>{setCompareMode(!cfg.compareMode)};
  document.getElementById("ragBtn").onclick=()=>{cfg.ragEnabled=!cfg.ragEnabled;saveLocal();updateRagBadge();if(cfg.ragEnabled) setStatus("知识库已开启");else setStatus("知识库已关闭");};

  document.querySelectorAll("#accentPicker .color-swatch").forEach(s=>{s.onclick=()=>{document.getElementById("cfgAccent").value=s.dataset.color;document.querySelectorAll("#accentPicker .color-swatch").forEach(x=>x.classList.remove("active"));s.classList.add("active");};});
  document.getElementById("cfgAccent").oninput=(e)=>{document.querySelectorAll("#accentPicker .color-swatch").forEach(x=>x.classList.toggle("active",(x.dataset.color||"").toLowerCase()===e.target.value.toLowerCase()));};

  const input=document.getElementById("input");
  input.addEventListener("input",()=>{autoResize(input);saveDraft()});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!generating)sendMessage()}});
  document.getElementById("sendBtn").onclick=()=>{if(generating){if(abortCtrl)abortCtrl.abort()}else sendMessage()};

  window.addEventListener("beforeunload",()=>{saveDraft();try{saveLocal()}catch(e){}});
  await fetchModels();
  updateCtxInfo();
  setInterval(()=>{if(!generating&&document.visibilityState==="visible")fetchModels()},30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!generating)fetchModels();});
}
function updateRagBadge(){
  const badge=document.getElementById("ragBadge");const btn=document.getElementById("ragBtn");if(!badge||!btn)return;
  if(cfg.ragEnabled){badge.textContent="开";btn.classList.add("on");}else{badge.textContent="关";btn.classList.remove("on");}
}
init();
</script>
</body>
